name: Trusted FBS Release Builder

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Enforce trusted caller
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REPOSITORY}" != "williamveith/fbs-interlock-gateway" ]]; then
            echo "Untrusted caller repository: ${GITHUB_REPOSITORY}"
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Trusted releases must be built from refs/heads/main."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi

          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}"
            exit 1
          fi

      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require validation tools
        shell: bash
        run: |
          set -euo pipefail

          commands=(
            go
            shellcheck
            pwsh
            python3
            file
            sha256sum
          )

          for command_name in "${commands[@]}"; do
            if ! command -v "${command_name}" >/dev/null 2>&1; then
              echo "Required command is unavailable: ${command_name}"
              exit 1
            fi
          done

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          make clean

          make release \
            VERSION="${RELEASE_VERSION}" \
            COMMIT="${GITHUB_SHA::7}" \
            DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Verify exact release asset set
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "build/release/fbs-interlock-gateway-linux-amd64"
            "build/release/fbs-interlock-gateway-linux-amd64.sha256"
            "build/release/fbs-interlock-gateway-linux-arm64"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256"
            "build/release/fbs-interlock-gateway-windows-amd64.exe"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256"
            "build/release/fbs-interlock-gateway-darwin-arm64"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256"
            "build/release/fbs-interlock-gateway-darwin-amd64"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256"
          )

          for file in "${files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "Missing release file: ${file}"
              exit 1
            fi
          done

          actual_count="$(
            find build/release -maxdepth 1 -type f | wc -l | tr -d ' '
          )"

          if [[ "${actual_count}" -ne "${#files[@]}" ]]; then
            echo "Unexpected files exist in build/release:"
            find build/release -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Verify checksums
        working-directory: build/release
        shell: bash
        run: |
          set -euo pipefail

          sha256sum --check fbs-interlock-gateway-linux-amd64.sha256
          sha256sum --check fbs-interlock-gateway-linux-arm64.sha256
          sha256sum --check fbs-interlock-gateway-windows-amd64.exe.sha256
          sha256sum --check fbs-interlock-gateway-darwin-arm64.sha256
          sha256sum --check fbs-interlock-gateway-darwin-amd64.sha256

      - name: Verify binary formats
        shell: bash
        run: |
          set -euo pipefail

          file build/release/fbs-interlock-gateway-linux-amd64 \
            | grep -Eq "ELF 64-bit.*x86-64"

          file build/release/fbs-interlock-gateway-linux-arm64 \
            | grep -Eq "ELF 64-bit.*ARM aarch64"

          file build/release/fbs-interlock-gateway-windows-amd64.exe \
            | grep -Eq "PE32\+ executable.*x86-64"

          file build/release/fbs-interlock-gateway-darwin-arm64 \
            | grep -Eiq "Mach-O 64-bit.*(arm64|aarch64).*executable"

          file build/release/fbs-interlock-gateway-darwin-amd64 \
            | grep -Eiq "Mach-O 64-bit.*x86_64.*executable"

      - name: Verify embedded metadata
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            ./build/release/fbs-interlock-gateway-linux-amd64 -version
          )"

          echo "${output}"

          if [[ "${output}" != *"version=${RELEASE_VERSION}"* ]]; then
            echo "Expected binary version ${RELEASE_VERSION}"
            exit 1
          fi

          if [[ "${output}" != *"commit=${GITHUB_SHA::7}"* ]]; then
            echo "Expected binary commit ${GITHUB_SHA::7}"
            exit 1
          fi

      - name: Ensure build did not modify source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Build modified tracked repository files:"
            git status --short
            git diff
            exit 1
          fi

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            build/release/fbs-interlock-gateway-linux-amd64
            build/release/fbs-interlock-gateway-linux-amd64.sha256
            build/release/fbs-interlock-gateway-linux-arm64
            build/release/fbs-interlock-gateway-linux-arm64.sha256
            build/release/fbs-interlock-gateway-windows-amd64.exe
            build/release/fbs-interlock-gateway-windows-amd64.exe.sha256
            build/release/fbs-interlock-gateway-darwin-arm64
            build/release/fbs-interlock-gateway-darwin-arm64.sha256
            build/release/fbs-interlock-gateway-darwin-amd64
            build/release/fbs-interlock-gateway-darwin-amd64.sha256

  attest:
    name: Generate SLSA provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-release-${{ github.sha }}
          path: build/release

      - name: Require expected subjects
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "build/release/fbs-interlock-gateway-linux-amd64"
            "build/release/fbs-interlock-gateway-linux-amd64.sha256"
            "build/release/fbs-interlock-gateway-linux-arm64"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256"
            "build/release/fbs-interlock-gateway-windows-amd64.exe"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256"
            "build/release/fbs-interlock-gateway-darwin-arm64"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256"
            "build/release/fbs-interlock-gateway-darwin-amd64"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256"
          )

          for file in "${files[@]}"; do
            test -f "${file}" || {
              echo "Missing attestation subject: ${file}"
              exit 1
            }
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/fbs-interlock-gateway-linux-amd64
            build/release/fbs-interlock-gateway-linux-amd64.sha256
            build/release/fbs-interlock-gateway-linux-arm64
            build/release/fbs-interlock-gateway-linux-arm64.sha256
            build/release/fbs-interlock-gateway-windows-amd64.exe
            build/release/fbs-interlock-gateway-windows-amd64.exe.sha256
            build/release/fbs-interlock-gateway-darwin-arm64
            build/release/fbs-interlock-gateway-darwin-arm64.sha256
            build/release/fbs-interlock-gateway-darwin-amd64
            build/release/fbs-interlock-gateway-darwin-amd64.sha256